name: Manual Trace project package contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'schema/trace-project-package/**'
      - 'tools/manual-trace/trace-project-package.js'
      - 'tools/manual-trace/trace-project-package-production.js'
      - 'tools/manual-trace/app-08.js'
      - 'tools/manual-trace/app-09.js'
      - 'tools/manual-trace/index.html'
      - 'tools/manual-trace/scripts/**'
      - 'tools/manual-trace/package.json'
      - 'tools/manual-trace/test/trace-project-package/**'
      - 'tools/tonearm-profile-designer/js/trace-project-package-reader.js'
      - 'tools/tonearm-profile-designer/js/trace-project-package-semantics.js'
      - 'tools/tonearm-profile-designer/js/trace-project-package-validator.js'
      - 'tools/tonearm-profile-designer/js/trace-project-package-adapter.js'
      - 'tools/tonearm-profile-designer/js/manual-trace-3d-adapter.js'
      - 'tools/tonearm-profile-designer/js/design-session.js'
      - 'tools/tonearm-profile-designer/js/session.js'
      - 'tools/tonearm-profile-designer/index.html'
      - 'tools/tonearm-profile-designer/scripts/**'
      - 'tools/tonearm-profile-designer/test/**'
      - 'tools/tonearm-profile-designer/tools/**'
      - '.github/workflows/manual-trace-project-package-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Production and contract syntax
        run: |
          node --check tools/manual-trace/trace-project-package.js
          node --check tools/manual-trace/trace-project-package-production.js
          node --check tools/manual-trace/app-08.js
          node --check tools/manual-trace/app-09.js
          node --check tools/manual-trace/scripts/build.mjs
          node --check tools/manual-trace/test/trace-project-package/contract-validator-core.mjs
          node --check tools/manual-trace/test/trace-project-package/identity-reference-validator.mjs
          node --check tools/manual-trace/test/trace-project-package/contract-validator.mjs
          node --check tools/manual-trace/test/trace-project-package/trace-project-package-contract.test.mjs
          node --check tools/manual-trace/test/trace-project-package/identity-reference-integrity.test.mjs
          node --check tools/manual-trace/test/trace-project-package/final-contract-closure.test.mjs
          node --check tools/manual-trace/test/trace-project-package/package-builder.test.mjs
          node --check tools/manual-trace/test/trace-project-package/package-adapter.test.mjs
          node --check tools/manual-trace/test/trace-project-package/package-production-contract.test.mjs
          node --check tools/manual-trace/test/trace-project-package/browser-export-smoke.mjs
      - name: Merged contract regressions
        run: |
          node --test tools/manual-trace/test/trace-project-package/trace-project-package-contract.test.mjs
          node --test tools/manual-trace/test/trace-project-package/identity-reference-integrity.test.mjs
          node --test tools/manual-trace/test/trace-project-package/final-contract-closure.test.mjs
      - name: Builder regressions
        run: node --test tools/manual-trace/test/trace-project-package/package-builder.test.mjs
      - name: Production contract and canonical-order regressions
        run: node --test tools/manual-trace/test/trace-project-package/package-production-contract.test.mjs
      - name: Manual Trace package adapter regression
        run: node --test tools/manual-trace/test/trace-project-package/package-adapter.test.mjs
      - name: Manual Trace built runtime
        run: npm --prefix tools/manual-trace run build
      - name: Chromium multi-view export smoke
        run: |
          set -o pipefail
          node tools/manual-trace/test/trace-project-package/browser-export-smoke.mjs 2>&1 | tee browser-smoke.log
      - name: Upload Chromium smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-trace-browser-smoke-${{ github.sha }}
          path: browser-smoke.log
          if-no-files-found: error
          retention-days: 3

  tonearm-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Schema acceptance validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Tonearm package import syntax
        run: |
          node --check tools/tonearm-profile-designer/js/trace-project-package-reader.js
          node --check tools/tonearm-profile-designer/js/trace-project-package-semantics.js
          node --check tools/tonearm-profile-designer/js/trace-project-package-validator.js
          node --check tools/tonearm-profile-designer/js/trace-project-package-adapter.js
          node --check tools/tonearm-profile-designer/test/trace-project-package-fixtures.cjs
          node --check tools/tonearm-profile-designer/test/trace-project-package-model.cjs
          node --check tools/tonearm-profile-designer/test/trace-project-package-browser-smoke.mjs
      - name: Tonearm bounded package reader
        run: node tools/tonearm-profile-designer/test/trace-project-package-reader.test.cjs
      - name: Tonearm package contract validator parity
        run: node tools/tonearm-profile-designer/test/trace-project-package-validator.test.cjs
      - name: Tonearm package geometry adapter
        run: node tools/tonearm-profile-designer/test/trace-project-package-adapter.test.cjs
      - name: Tonearm export-to-import roundtrip
        run: node tools/tonearm-profile-designer/test/trace-project-package-roundtrip.test.cjs
      - name: Tonearm Profile Designer portable regression
        run: npm --prefix tools/tonearm-profile-designer test
      - name: Tonearm built runtime
        run: npm --prefix tools/tonearm-profile-designer run build
      - name: Chromium package import smoke
        run: |
          set -o pipefail
          node tools/tonearm-profile-designer/test/trace-project-package-browser-smoke.mjs 2>&1 | tee tonearm-import-smoke.log
      - name: Upload Chromium import smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tonearm-package-import-smoke-${{ github.sha }}
          path: tonearm-import-smoke.log
          if-no-files-found: error
          retention-days: 3

  root-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Schema acceptance validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Manual Trace regression
        run: node --test test/manual-trace-snap-policy.test.mjs
      - name: Clean generated output
        run: npm run clean
      - name: Production build
        run: npm run build
      - name: Generated SEO parity
        run: npm run check:seo
      - name: Deterministic build
        run: npm run check:determinism
      - name: Full sanitation gate
        run: npm run check:sanitation
